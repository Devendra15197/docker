    ports:
      - "5006:5006"
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      preferencedb:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-service:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://preferencedb:5432/job_portal_preference
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SERVER_PORT: 5006
    networks:
      - job-portal-network

  resume-service:
    image: devendra1597/job-portal-resume-service:latest
    platform: linux/amd64
    container_name: job-portal-resume-service
    mem_limit: 512m
    mem_reservation: 256m
