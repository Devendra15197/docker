networks:
  job-portal-network:
    driver: bridge

services:

  # ===========================
  # DATABASE SERVICES
  # ===========================

  userdb:
    image: postgres:16
    container_name: job-portal-userdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: job_portal_user
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - job-portal-network


