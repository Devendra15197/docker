networks:
  job-portal-network:
    driver: bridge

services:

  # ===========================
  # DATABASE SERVICES
  # ===========================

  userdb:
    image: postgres:16
    platform: linux/amd64
    container_name: job-portal-userdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: job_portal_user
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - job-portal-network


  companydb:
    image: postgres:16
    platform: linux/amd64
    container_name: job-portal-companydb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: job_portal_company
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - job-portal-network

  jobdb:
    image: postgres:16
    platform: linux/amd64
    container_name: job-portal-jobdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: job_portal_job
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - job-portal-network

  applicationdb:
    image: postgres:16
    platform: linux/amd64
    container_name: job-portal-applicationdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: job_portal_application
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - job-portal-network

  preferencedb:
    image: postgres:16
    platform: linux/amd64
    container_name: job-portal-preferencedb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5437:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: job_portal_preference
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - job-portal-network

  resumedb:
    image: postgres:16
    platform: linux/amd64
    container_name: job-portal-resumedb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5438:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: job_portal_resume
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - job-portal-network

    # ===========================
    # SPRING CLOUD SERVICES
    # ===========================

  discovery-service:
    image: devendra1597/job-portal-service-registry:latest
    platform: linux/amd64
    container_name: job-portal-discovery-server
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "8761:8761"
    healthcheck:
      test: [ "CMD-SHELL", "wget http://localhost:8761/actuator/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 8
    networks:
      - job-portal-network


  config-service:
    image: devendra1597/job-portal-config-server:latest
    platform: linux/amd64
    container_name: job-portal-config-server
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "8888:8888"
    depends_on:
      discovery-service:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    healthcheck:
      test: [ "CMD-SHELL", "wget http://localhost:8888/actuator/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 8
    networks:
      - job-portal-network


  gateway-service:
    image: devendra1597/job-portal-api-gateway:latest
    platform: linux/amd64
    container_name: job-portal-api-gateway
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5007:5007"
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-service:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SERVER_PORT: 5007
    healthcheck:
      test: [ "CMD-SHELL", "wget http://localhost:5007/actuator/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 8
    networks:
      - job-portal-network

  user-service:
    image: devendra1597/job-portal-user-service:latest
    platform: linux/amd64
    container_name: job-portal-user-service
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5001:5001"
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      userdb:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-service:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://userdb:5432/job_portal_user
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SERVER_PORT: 5001
    networks:
      - job-portal-network

  company-service:
    image: devendra1597/job-portal-company-service:latest
    platform: linux/amd64
    container_name: job-portal-company-service
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5002:5002"
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      companydb:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-service:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://companydb:5432/job_portal_company
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SERVER_PORT: 5002
    networks:
      - job-portal-network


  job-service:
    image: devendra1597/job-portal-job-service:latest
    platform: linux/amd64
    container_name: job-portal-job-service
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5003:5003"
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      jobdb:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-service:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://jobdb:5432/job_portal_job
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SERVER_PORT: 5003
    networks:
      - job-portal-network

  application-service:
    image: devendra1597/job-portal-application-service:latest
    platform: linux/amd64
    container_name: job-portal-application-service
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5005:5005"
    depends_on:
      discovery-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      applicationdb:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-service:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://applicationdb:5432/job_portal_application
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SERVER_PORT: 5005
    networks:
      - job-portal-network

  preference-service:
    image: devendra1597/job-portal-preferences-service:latest
    platform: linux/amd64
    container_name: job-portal-preferences-service
    mem_limit: 512m
    mem_reservation: 256m
