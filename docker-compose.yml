    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-service:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://resumedb:5432/job_portal_resume
      SPRING_DATASOURCE_USERNAME: postgres
